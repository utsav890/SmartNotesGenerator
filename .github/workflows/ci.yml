name: NoteFlow CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends ffmpeg libmariadb-dev-compat libmariadb-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Syntax & App Import
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "testing"
          JWT_SECRET: "CiSecretKeyForAutomatedEvaluation2026!"
          GEMINI_API_KEY: "gemini_ci_mock_test_key_for_automated_testing_12345"
        run: |
          cd backend
          python -m compileall -q app
          python -c "from app.main import app; print('FastAPI app verified:', app.title)"

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React SPA
        run: |
          cd frontend
          npm run build

